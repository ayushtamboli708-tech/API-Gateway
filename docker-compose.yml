services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_BACKENDS: '{"users":"http://host.docker.internal:9001","orders":"http://host.docker.internal:9002"}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
